name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check src tests

      - name: Check formatting (Ruff format)
        run: uv run ruff format --check src tests

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medbook
          POSTGRES_PASSWORD: medbook
          POSTGRES_DB: medbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medbook -d medbook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI-specific environment variables
      APP_ENV: test
      APP_DEBUG: "false"
      SECRET_KEY: "ci-test-secret-key-do-not-use-in-production-0123456789abcdef"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: medbook
      POSTGRES_PASSWORD: medbook
      POSTGRES_DB: medbook_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v
